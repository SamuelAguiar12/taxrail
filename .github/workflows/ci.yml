name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  verify:
    name: Typecheck, Test & Wrangler Dry-Run
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm 10
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Run typecheck across workspace
        run: pnpm typecheck

      - name: Run tests across workspace
        run: pnpm test

      - name: Cloudflare Workers deploy dry-run
        run: pnpm deploy:dry-run
